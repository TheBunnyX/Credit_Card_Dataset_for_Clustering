<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" width="1700" height="900" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <title>How it works: training pipeline and serving + prediction</title>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 11 4.5, 0 9" fill="#222"/>
    </marker>
    <symbol id="doc" viewBox="0 0 40 50">
      <path d="M4 2 H26 L36 12 V46 H4 Z" fill="#fff" stroke="#1f2a44" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M26 2 V12 H36" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M11 22 H29 M11 29 H29 M11 36 H23" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="users" viewBox="0 0 120 100">
      <g fill="none" stroke="#1f2a44" stroke-width="5" stroke-linecap="round">
        <circle cx="26" cy="24" r="13"/>
        <path d="M2 66 Q2 44 26 44 Q38 44 44 50"/>
        <circle cx="94" cy="24" r="13"/>
        <path d="M118 66 Q118 44 94 44 Q82 44 76 50"/>
        <path d="M60 52 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0" fill="#f4f4f4"/>
        <path d="M30 96 Q30 70 60 70 Q90 70 90 96" fill="#f4f4f4"/>
      </g>
    </symbol>
  </defs>

  <rect width="1700" height="900" fill="#f4f4f4"/>

  <!-- ===================== Lane 1: training ===================== -->
  <rect x="20" y="20" width="1660" height="420" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="50" y="418" font-size="38" font-weight="700" font-style="italic" fill="#4a4a4a">Training pipeline</text>

  <!-- raw data -->
  <use href="#doc" x="48" y="190" width="56" height="70"/>
  <text x="80" y="288" font-size="14" text-anchor="middle" fill="#222">CCGENERAL.csv</text>
  <text x="80" y="308" font-size="14" text-anchor="middle" fill="#444">8,950 × 17</text>
  <line x1="116" y1="225" x2="186" y2="225" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- preprocessing steps -->
  <g font-size="15" font-weight="700" font-style="italic" fill="#fff" text-anchor="middle">
    <rect x="190" y="185" width="112" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="246" y="219">Impute</text>
    <text x="246" y="240" font-size="12" font-weight="400" font-style="normal">median + flag</text>

    <rect x="328" y="185" width="112" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="384" y="219">log1p</text>
    <text x="384" y="240" font-size="12" font-weight="400" font-style="normal">skewed columns</text>

    <rect x="466" y="185" width="112" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="522" y="219">Engineer</text>
    <text x="522" y="240" font-size="12" font-weight="400" font-style="normal">22 features</text>

    <rect x="604" y="185" width="112" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="660" y="219">Standardise</text>
    <text x="660" y="240" font-size="12" font-weight="400" font-style="normal">mean 0, sd 1</text>

    <rect x="742" y="185" width="112" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="798" y="219">PCA</text>
    <text x="798" y="240" font-size="12" font-weight="400" font-style="normal">90% var → 9 dims</text>
  </g>
  <g stroke="#222" stroke-width="2.2" fill="none" marker-end="url(#a)">
    <line x1="302" y1="225" x2="326" y2="225" marker-end="url(#a)"/>
    <line x1="440" y1="225" x2="464" y2="225" marker-end="url(#a)"/>
    <line x1="578" y1="225" x2="602" y2="225" marker-end="url(#a)"/>
    <line x1="716" y1="225" x2="740" y2="225" marker-end="url(#a)"/>
  </g>
  <text x="522" y="302" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Preprocessing</text>
  <text x="522" y="322" font-size="13" fill="#555" text-anchor="middle">one scikit-learn Pipeline</text>

  <!-- fan-out to model-selection metrics -->
  <g stroke="#222" stroke-width="2.2" fill="none">
    <line x1="858" y1="225" x2="946" y2="112" marker-end="url(#a)"/>
    <line x1="858" y1="225" x2="946" y2="225" marker-end="url(#a)"/>
    <line x1="858" y1="225" x2="946" y2="338" marker-end="url(#a)"/>
  </g>
  <g font-size="15" font-weight="700" font-style="italic" fill="#fff" text-anchor="middle">
    <rect x="950" y="77" width="170" height="70" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1035" y="108">Silhouette</text>
    <text x="1035" y="128" font-size="12" font-weight="400" font-style="normal">cluster separation</text>

    <rect x="950" y="190" width="170" height="70" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1035" y="221">Davies-Bouldin</text>
    <text x="1035" y="241" font-size="12" font-weight="400" font-style="normal">cluster compactness</text>

    <rect x="950" y="303" width="170" height="70" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1035" y="334">Stability (ARI)</text>
    <text x="1035" y="354" font-size="12" font-weight="400" font-style="normal">80% bootstrap subsamples</text>
  </g>
  <text x="1035" y="404" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Choose k (3–8)</text>
  <g stroke="#222" stroke-width="2.2" fill="none">
    <path d="M1120 112 L1160 225"/>
    <path d="M1120 225 L1160 225"/>
    <path d="M1120 338 L1160 225"/>
    <line x1="1160" y1="225" x2="1198" y2="225" marker-end="url(#a)"/>
  </g>
  <text x="1265" y="158" font-size="14" font-style="italic" fill="#0e7aa8" text-anchor="middle">rank-average → k = 7</text>

  <!-- k-means -->
  <rect x="1200" y="175" width="130" height="100" fill="#c9dcff" stroke="#1f2a44" stroke-width="2.2"/>
  <text x="1265" y="216" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2a44">K-Means</text>
  <text x="1265" y="240" font-size="14" text-anchor="middle" fill="#1f2a44">k = 7</text>
  <text x="1265" y="258" font-size="12" text-anchor="middle" fill="#445">n_init = 20</text>
  <text x="1265" y="302" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Clustering</text>
  <line x1="1332" y1="225" x2="1366" y2="225" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- profiling -->
  <g font-size="15" font-weight="700" font-style="italic" fill="#fff" text-anchor="middle">
    <rect x="1370" y="185" width="130" height="80" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1435" y="219">Profile + name</text>
    <text x="1435" y="240" font-size="12" font-weight="400" font-style="normal">z-scores, strategy</text>
  </g>
  <text x="1435" y="302" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Profiling</text>
  <line x1="1502" y1="225" x2="1538" y2="225" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- model store (cylinder) -->
  <g stroke="#1f2a44" stroke-width="2.2" fill="#c9dcff">
    <path d="M1545 166 V284 A60 16 0 0 0 1665 284 V166"/>
    <ellipse cx="1605" cy="166" rx="60" ry="16"/>
  </g>
  <text x="1605" y="222" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2a44">Model store</text>
  <text x="1605" y="244" font-size="12" text-anchor="middle" fill="#1f2a44">pipeline.joblib</text>
  <text x="1605" y="260" font-size="12" text-anchor="middle" fill="#1f2a44">segments.json</text>
  <text x="1592" y="342" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="end">Save</text>

  <!-- ===================== Lane 2: serving ===================== -->
  <rect x="20" y="460" width="1660" height="420" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="50" y="525" font-size="38" font-weight="700" font-style="italic" fill="#4a4a4a">Serving + Prediction</text>

  <!-- users -->
  <use href="#users" x="55" y="595" width="120" height="100"/>
  <text x="115" y="722" font-size="20" text-anchor="middle" fill="#222">Users</text>

  <!-- request -->
  <use href="#doc" x="212" y="588" width="30" height="38"/>
  <text x="227" y="646" font-size="13" text-anchor="middle" fill="#222">Customer</text>
  <text x="227" y="662" font-size="13" text-anchor="middle" fill="#222">fields</text>
  <line x1="190" y1="680" x2="286" y2="680" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- web app -->
  <rect x="290" y="620" width="140" height="120" fill="#c9dcff" stroke="#1f2a44" stroke-width="2.2"/>
  <text x="360" y="672" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2a44">Web app</text>
  <text x="360" y="694" font-size="12" text-anchor="middle" fill="#1f2a44">TH / EN, 7 tabs</text>
  <text x="360" y="711" font-size="12" text-anchor="middle" fill="#1f2a44">Chart.js</text>
  <line x1="432" y1="680" x2="516" y2="680" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- flask api -->
  <rect x="520" y="620" width="140" height="120" fill="#c9dcff" stroke="#1f2a44" stroke-width="2.2"/>
  <text x="590" y="672" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2a44">Flask API</text>
  <text x="590" y="694" font-size="12" text-anchor="middle" fill="#1f2a44">/api/predict</text>
  <text x="590" y="711" font-size="12" text-anchor="middle" fill="#1f2a44">validate input</text>
  <line x1="662" y1="680" x2="736" y2="680" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- saved pipeline -->
  <rect x="740" y="610" width="210" height="140" fill="#c9dcff" stroke="#1f2a44" stroke-width="2.2"/>
  <text x="845" y="658" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2a44">Saved pipeline</text>
  <text x="845" y="684" font-size="12" text-anchor="middle" fill="#1f2a44">features → impute → scale</text>
  <text x="845" y="702" font-size="12" text-anchor="middle" fill="#1f2a44">→ PCA → K-Means</text>
  <text x="845" y="724" font-size="12" text-anchor="middle" fill="#445">same steps as training</text>
  <text x="845" y="782" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Predict</text>

  <!-- load once from model store -->
  <path d="M1605 308 V500 Q1605 520 1585 520 H865 Q845 520 845 540 V608" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="1225" y="510" font-size="18" font-style="italic" fill="#0e7aa8" text-anchor="middle">Load once at start-up</text>

  <!-- fan-out to outputs -->
  <g stroke="#222" stroke-width="2.2" fill="none">
    <line x1="954" y1="680" x2="1036" y2="590" marker-end="url(#a)"/>
    <line x1="954" y1="680" x2="1036" y2="680" marker-end="url(#a)"/>
    <line x1="954" y1="680" x2="1036" y2="770" marker-end="url(#a)"/>
  </g>
  <g font-size="15" font-weight="700" font-style="italic" fill="#fff" text-anchor="middle">
    <rect x="1040" y="558" width="180" height="64" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1130" y="587">Nearest centroid</text>
    <text x="1130" y="607" font-size="12" font-weight="400" font-style="normal">→ segment</text>

    <rect x="1040" y="648" width="180" height="64" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1130" y="677">Confidence</text>
    <text x="1130" y="697" font-size="12" font-weight="400" font-style="normal">1 − d1 / d2 (two nearest)</text>

    <rect x="1040" y="738" width="180" height="64" fill="#0b7bb0" stroke="#0b4f7a" stroke-width="2"/>
    <text x="1130" y="767">Reasons</text>
    <text x="1130" y="787" font-size="12" font-weight="400" font-style="normal">top 3 vs. population percentiles</text>
  </g>
  <g stroke="#222" stroke-width="2.2" fill="none">
    <path d="M1220 590 L1262 680"/>
    <path d="M1220 680 L1262 680"/>
    <path d="M1220 770 L1262 680"/>
    <line x1="1262" y1="680" x2="1298" y2="680" marker-end="url(#a)"/>
  </g>

  <!-- response box -->
  <rect x="1300" y="620" width="190" height="120" fill="#c9dcff" stroke="#1f2a44" stroke-width="2.2"/>
  <text x="1395" y="660" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2a44">JSON response</text>
  <text x="1395" y="685" font-size="12" text-anchor="middle" fill="#1f2a44">segment, confidence,</text>
  <text x="1395" y="702" font-size="12" text-anchor="middle" fill="#1f2a44">reasons, strategy</text>
  <text x="1395" y="719" font-size="12" text-anchor="middle" fill="#445">(Thai + English)</text>

  <!-- response returns to users -->
  <path d="M1395 742 V836 H115 V740" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#a)"/>
  <use href="#doc" x="660" y="796" width="30" height="38"/>
  <text x="702" y="822" font-size="16" fill="#222">Response</text>
  <text x="702" y="860" font-size="14" font-style="italic" fill="#0e7aa8">Which segment, how sure, why, and what to do</text>
</svg>
